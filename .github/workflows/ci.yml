name: FinCore CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Backend Dependencies
      run: |
        cd server
        npm install

    - name: Install Frontend Dependencies
      run: |
        cd client
        npm install

    - name: Run Frontend Lint
      run: |
        cd client
        npm run lint

    - name: Run Backend Integration Tests
      run: |
        cd server
        npm test

    - name: Verify Frontend Build
      run: |
        cd client
        npm run build
